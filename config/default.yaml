logger:
  production: true

server:
  name: "go-product"
  production: true
  adminAddr: ":4040"
  shutdownTimeout: 15s

restful_api:
  production: true
  addr: ":5050"
  corsAllowOrigins: []

# PostgreSQL connection configuration (required runtime dependency).
# Environment overrides: POSTGRES__URL (required), POSTGRES__MAX_CONNS, POSTGRES__MIN_CONNS,
# POSTGRES__MAX_CONN_LIFETIME, POSTGRES__MAX_CONN_IDLE_TIME, POSTGRES__HEALTH_CHECK_PERIOD,
# POSTGRES__CONNECT_TIMEOUT.
postgres:
  url: ""

# Redis configuration (optional runtime dependency, disabled by default).
# Environment overrides: REDIS__ENABLED, REDIS__CONFIG__ADDR,
# REDIS__CONFIG__PASSWORD, REDIS__CONFIG__USERNAME, REDIS__CONFIG__DB.
redis:
  enabled: false
  config:
    addr: "127.0.0.1:6379"
    password: ""

# Upstream go-auth verification settings for admin endpoints.
auth:
  url: "http://go-auth:5050"
  client_id: "624069170559-rp51efcr9bg5tgacgqoelhhmmgqouai4.apps.googleusercontent.com"
  client_secret: "/2rH2+Ia1Vxe9lz15Wh6X2tsuU6Qy9G1UH4sWm3iVbU="
  provider: "google"
  timeout: 5s
